                }</style></noscript><style>.fi{fill:none;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}</style></head><body class="is-preload page-template"><div id="wrapper"><header id="header"><a class="logo logo-image" href="https://lacreualtallampsitrons.cat/"><img src="https://lacreualtallampsitrons.cat/media/website/prova-fons3.svg" alt="Llamps i Trons" width="786" height="324"></a></header><nav id="nav"><ul class="links"><li><a href="https://lacreualtallampsitrons.cat/" target="_self">Inici</a></li><li><a href="https://lacreualtallampsitrons.cat/qui-som/" target="_self">Qui som?</a></li><li><a href="https://lacreualtallampsitrons.cat/activitats/" target="_self">Activitats</a></li><li><a href="https://lacreualtallampsitrons.cat/festa-major-de-la-creu-alta/" target="_self">Festa Major de la Creu Alta</a></li><li><a href="https://lacreualtallampsitrons.cat/marcador/" target="_self">Marcador</a></li><li><a href="https://lacreualtallampsitrons.cat/contacte/" target="_self">Contacte</a></li></ul></nav><main id="main"><article class="post"><header class="major"><h1>Editor</h1><p class="post__inner"></p></header><div class="post__inner post__entry"><h1>Editor del marcador</h1><p><button>Load JSON</button></p><table id="jsonTable"><thead><tr><th>Title</th><th>Points</th><th>Winner</th><th>Action</th></tr></thead></table><p><button>Add Row</button> <button>Reset status</button> <button>Save</button><script>const repo="cj-llampsitrons/comptador";
const path="data.json";
const branch="main";

/* PASTE YOUR ENCRYPTED TOKEN HERE */
const ENCRYPTED_TOKEN="eyJpdiI6WzE3OSwxMjQsMTgzLDE1OSwyMjksOSwxNTksODQsNTcsNDIsMTMzLDExOV0sImRhdGEiOlsxODEsMjA0LDIwMywxNTcsMTc3LDYzLDE1MSw0MiwxMTUsMjA4LDEzNSwxMzUsMjIyLDEyNywyMTEsMTQzLDE2NCwxODQsMTkwLDMwLDU4LDIzOCw2NSw4MiwzMiwxNDMsMjI0LDE0NywxNDIsMTYsMTY4LDI1LDEwOSwyMzQsMTIyLDE2Miw3OCwyMzksMTE5LDExNiwyMDAsMTM1LDE0NCwxNjUsMTkxLDQ0LDE5NywyMzYsMjUzLDE3OSwyNTQsMTQ3LDc1LDQsMTU0LDkwXX0=";

let elements=[];
let sha="";
let token="";

const winners=[
"Trons",
"Llamps",
"Anul·lat",
"Per disputar",
"Sense puntuació"
];

async function unlockToken(){

const stored=JSON.parse(atob(ENCRYPTED_TOKEN));
const password=prompt("Password");

const enc=new TextEncoder();
const dec=new TextDecoder();

const keyMaterial=await crypto.subtle.importKey(
"raw",
enc.encode(password),
"PBKDF2",
false,
["deriveKey"]
);

const key=await crypto.subtle.deriveKey(
{
name:"PBKDF2",
salt:enc.encode("github-editor"),
iterations:100000,
hash:"SHA-256"
},
keyMaterial,
{name:"AES-GCM",length:256},
false,
["decrypt"]
);

const decrypted=await crypto.subtle.decrypt(
{name:"AES-GCM",iv:new Uint8Array(stored.iv)},
key,
new Uint8Array(stored.data)
);

token=dec.decode(decrypted);

}

function decodeBase64UTF8(str){
const bytes=atob(str).split('').map(c=>c.charCodeAt(0));
return new TextDecoder().decode(new Uint8Array(bytes));
}

function encodeBase64UTF8(str){
return btoa(unescape(encodeURIComponent(str)));
}

async function fetchJSON(){

if(!token) await unlockToken();

const url=`https://api.github.com/repos/${repo}/contents/${path}?ref=${branch}&nocache=${Date.now()}`;

const res=await fetch(url,{
headers:{Authorization:`token ${token}`}
});

const data=await res.json();

sha=data.sha;

elements=JSON.parse(
decodeBase64UTF8(data.content)
).elements;

renderTable();

}

function renderTable(){

const tbody=document.querySelector("#jsonTable tbody");
tbody.innerHTML="";

elements.forEach((el,i)=>{

const row=document.createElement("tr");

const opts=winners.map(w=>
`<option value="${w}" ${w===el.winner?'selected':''}>${w}</option>`
).join("");

row.innerHTML=`
<td><input value="${el.title}"></td>
<td><input type="number" value="${el.points}" min="0"></td>
<td><select>${opts}</select></td>
<td><button onclick="removeRow(${i})">Remove</button></td>
`;

tbody.appendChild(row);

});

}

function addRow(){

elements.push({
title:"",
points:0,
winner:"Per disputar"
});

renderTable();

}

function removeRow(i){

elements.splice(i,1);
renderTable();

}

function resetStatus(){

if(!confirm("Reset all winners to 'Per disputar'?")) return;

elements=elements.map(e=>({...e,winner:"Per disputar"}));

renderTable();

}

function updateElements(){

const rows=document.querySelectorAll("#jsonTable tbody tr");

elements=[...rows].map(r=>({

title:r.cells[0].querySelector("input").value,
points:parseInt(r.cells[1].querySelector("input").value)||0,
winner:r.cells[2].querySelector("select").value

}));

}

async function saveJSON(){

updateElements();

const body={
message:"Update data.json",
content:encodeBase64UTF8(JSON.stringify({elements},null,2)),
sha:sha,
branch:branch
};

const res=await fetch(
`https://api.github.com/repos/${repo}/contents/${path}`,
{
method:"PUT",
headers:{
Authorization:`token ${token}`,
"Content-Type":"application/json"
},
body:JSON.stringify(body)
}
);

const result=await res.json();

if(result.content){

sha=result.content.sha;

alert("Saved");

setTimeout(fetchJSON,1000);

}else{

alert(JSON.stringify(result));

}

}</script></p></div></article></main><footer id="copyright"><ul><li>Coordinadora Jove de la Creu Alta "Llamps i Trons"</li></ul><p class="align-center" style="padding-top: 30px;"><a href="https://instagram.com/llampsitrons" target="_blank" rel="noopener"><svg class="fi fi-instagram" width="24px" height="24px" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><use href="https://lacreualtallampsitrons.cat/media/plugins/featherIcons/feather-sprite.svg#instagram"/></svg></a>          <a href="https://twitter.com/llampsitrons" target="_blank" rel="noopener"><svg class="fi fi-twitter" width="24px" height="24px" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><use href="https://lacreualtallampsitrons.cat/media/plugins/featherIcons/feather-sprite.svg#twitter"/></svg></a>         <a href="https://www.google.com/maps?ll=41.555944,2.102388&amp;z=16&amp;t=m&amp;hl=ca&amp;gl=ES&amp;mapclient=embed&amp;cid=5111388773219777051" target="_blank" rel="noopener"><svg class="fi fi-map-pin" width="24px" height="24px" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><use href="https://lacreualtallampsitrons.cat/media/plugins/featherIcons/feather-sprite.svg#map-pin"/></svg></a></p></footer></div><script src="https://lacreualtallampsitrons.cat/assets/js/jquery.min.js?v=c9771cc3e90e18f5336eedbd0fffb2cf"></script><script src="https://lacreualtallampsitrons.cat/assets/js/jquery.scrollex.min.js?v=f89065e3d988006af9791b44561d7c90"></script><script src="https://lacreualtallampsitrons.cat/assets/js/jquery.scrolly.min.js?v=1ed5a78bde1476875a40f6b9ff44fc14"></script><script src="https://lacreualtallampsitrons.cat/assets/js/browser.min.js?v=c07298dd19048a8a69ad97e754dfe8d0"></script><script src="https://lacreualtallampsitrons.cat/assets/js/breakpoints.min.js?v=81a479eb099e3b187613943b085923b8"></script><script src="https://lacreualtallampsitrons.cat/assets/js/util.min.js?v=4201a626f8c9b614a663b3a1d7d82615"></script><script src="https:
