<!DOCTYPE html>
<html lang="ca">
<head>
<link rel="shortcut icon" href="https://lacreualtallampsitrons.cat/media/website/LOGOTIP-removebg-preview.png" type="image/png">
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>Editor Marcador FM</title>

<style>

:root{
    --bg:#0f172a;
    --card:#111827;
    --card-2:#1f2937;
    --text:#f3f4f6;
    --muted:#9ca3af;
    --border:#374151;
    --primary:#3b82f6;
    --primary-hover:#2563eb;
    --danger:#ef4444;
    --danger-hover:#dc2626;
    --success:#10b981;
    --warning:#f59e0b;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Inter,Arial,sans-serif;
    background:linear-gradient(180deg,#0f172a,#111827);
    color:var(--text);
    min-height:100vh;
    padding:24px;
}

a{
    color:var(--muted);
}

.container{
    max-width:1200px;
    margin:auto;
}

.header{
    display:flex;
    flex-wrap:wrap;
    gap:16px;
    justify-content:space-between;
    align-items:center;
    margin-bottom:24px;
}

h1{
    margin:0;
    font-size:clamp(1.8rem,3vw,2.6rem);
}

.subtitle{
    color:var(--muted);
    margin-top:6px;
}

.card{
    background:rgba(17,24,39,.9);
    border:1px solid var(--border);
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 12px 30px rgba(0,0,0,.25);
}

.toolbar{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    padding:18px;
    border-bottom:1px solid var(--border);
    background:rgba(255,255,255,.02);
}

button{
    border:none;
    border-radius:12px;
    padding:10px 14px;
    font-size:.92rem;
    font-weight:600;
    cursor:pointer;
    transition:.2s ease;
}

button:hover{
    transform:translateY(-1px);
}

.btn-primary{
    background:var(--primary);
    color:white;
}

.btn-primary:hover{
    background:var(--primary-hover);
}

.btn-secondary{
    background:var(--card-2);
    color:white;
}

.btn-danger{
    background:var(--danger);
    color:white;
}

.btn-danger:hover{
    background:var(--danger-hover);
}

.btn-success{
    background:var(--success);
    color:white;
}

.btn-warning{
    background:var(--warning);
    color:white;
    margin-left: auto;
}

.move-buttons{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
}

.move-buttons button{
    min-width:42px;
    padding:10px;
}

.table-wrapper{
    overflow:auto;
}

table{
    width:100%;
    border-collapse:collapse;
}

thead{
    background:rgba(255,255,255,.03);
}

th{
    text-align:left;
    padding:16px;
    color:#d1d5db;
    font-size:.9rem;
    border-bottom:1px solid var(--border);
}

td{
    padding:12px 16px;
    border-bottom:1px solid rgba(255,255,255,.06);
}

tr:hover{
    background:rgba(255,255,255,.02);
}

input,
select{
    width:100%;
    padding:12px;
    border-radius:10px;
    border:1px solid var(--border);
    background:#0b1220;
    color:white;
    font-size:.95rem;
}

input:focus,
select:focus{
    outline:none;
    border-color:var(--primary);
}

.status{
    padding:16px 18px;
    color:var(--muted);
    font-size:.92rem;
    display:flex;
    justify-content:space-between;
    gap:12px;
    flex-wrap:wrap;
}

.mobile-card{
    display:none;
}

.card-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-bottom:12px;
}

.mobile-actions{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
}

@media (max-width: 820px){

    body{
        padding:16px;
    }

    table{
        display:none;
    }

    .mobile-card{
        display:block;
        padding:16px;
        border-bottom:1px solid rgba(255,255,255,.06);
    }

    .mobile-card:last-child{
        border-bottom:none;
    }

    .mobile-grid{
        display:grid;
        gap:12px;
    }

    .field label{
        display:block;
        margin-bottom:6px;
        font-size:.85rem;
        color:var(--muted);
    }

    .field button{
        width:100%;
    }

}

</style>
</head>

<body>

<div class="container">

    <div class="header">
        <div>
            <h1>Editor Marcador FM</h1>
            <div class="subtitle">
                Editor del JSON de les proves amb GitHub API. <br><br><i><b>NOTA:</b> Cal configurar abans el document ght.txt correctament amb <a href="/encriptador.html" target="_Blank">l'encriptador</a>.</i>
            </div>
        </div>
    </div>

    <div class="card">

        <div class="toolbar">

            <button class="btn-primary" id="loadBtn">
                Carregar informació
            </button>

            <button class="btn-secondary" id="addBtn">
                Afegir fila
            </button>

            <button class="btn-success" id="saveBtn">
                Guardar
            </button>

            <button class="btn-warning" id="resetBtn">
                Restaurar pre-FM
            </button>

        </div>

        <div class="status">

            <div id="statusText">
                Sense carregar
            </div>

            <div id="dirtyText">
                Sense canvis
            </div>

        </div>

        <div class="table-wrapper">

            <table id="jsonTable">

                <thead>
                    <tr>
                        <th>#</th>
                        <th>Títol</th>
                        <th>Punts</th>
                        <th>Guanyador</th>
                        <th>Ordre</th>
                        <th>Acció</th>
                    </tr>
                </thead>

                <tbody></tbody>

            </table>

            <div id="mobileList"></div>

        </div>

    </div>

</div>

<script>

const repo = "cj-llampsitrons/comptador";
const path = "data.json";
const branch = "main";

const winners = [
    "Trons",
    "Llamps",
    "Anul·lat",
    "Per disputar",
    "Sense puntuació",
    "Sense guanyador",
    "Empat"
];

let token = "";
let sha = "";
let elements = [];
let dirty = false;

const tbody = document.querySelector("#jsonTable tbody");
const mobileList = document.querySelector("#mobileList");

const statusText = document.querySelector("#statusText");
const dirtyText = document.querySelector("#dirtyText");

function setDirty(value){

    dirty = value;

    dirtyText.textContent = dirty
        ? "Canvis pendents"
        : "Tot guardat";

}

function updateStatus(text){
    statusText.textContent = text;
}

async function loadEncryptedToken(){

    const res = await fetch("/ght.txt");

    if(!res.ok){
        throw new Error("No s'ha pogut llegir ght.txt");
    }

    return res.text();

}

async function unlockToken(){

    if(token) return;

    const ENCRYPTED_TOKEN = await loadEncryptedToken();

    const stored = JSON.parse(atob(ENCRYPTED_TOKEN));

    const password = prompt("Password");

    const enc = new TextEncoder();
    const dec = new TextDecoder();

    const keyMaterial = await crypto.subtle.importKey(
        "raw",
        enc.encode(password),
        "PBKDF2",
        false,
        ["deriveKey"]
    );

    const key = await crypto.subtle.deriveKey(
        {
            name: "PBKDF2",
            salt: enc.encode("github-editor"),
            iterations: 100000,
            hash: "SHA-256"
        },
        keyMaterial,
        {
            name: "AES-GCM",
            length: 256
        },
        false,
        ["decrypt"]
    );

    const decrypted = await crypto.subtle.decrypt(
        {
            name: "AES-GCM",
            iv: new Uint8Array(stored.iv)
        },
        key,
        new Uint8Array(stored.data)
    );

    token = dec.decode(decrypted);

}

function decodeBase64UTF8(str){

    const bytes = atob(str)
        .split("")
        .map(c => c.charCodeAt(0));

    return new TextDecoder().decode(
        new Uint8Array(bytes)
    );

}

function encodeBase64UTF8(str){

    return btoa(
        unescape(
            encodeURIComponent(str)
        )
    );

}

async function fetchJSON(){

    try{

        updateStatus("Carregant...");
        await unlockToken();

        const url =
            `https://api.github.com/repos/${repo}/contents/${path}?ref=${branch}&nocache=${Date.now()}`;

        const res = await fetch(url,{
            headers:{
                Authorization:`token ${token}`
            }
        });

        if(!res.ok){
            throw new Error("Error carregant JSON");
        }

        const data = await res.json();

        sha = data.sha;

        elements = JSON.parse(
            decodeBase64UTF8(data.content)
        ).elements || [];

        render();

        setDirty(false);

        updateStatus("JSON carregat");

    }catch(err){

        console.error(err);

        updateStatus("Error carregant dades");

        alert(err.message);

    }

}

function render(){

    renderDesktop();
    renderMobile();

}

function renderDesktop(){

    tbody.innerHTML = "";

    elements.forEach((el,index)=>{

        const tr = document.createElement("tr");

        tr.innerHTML = `

            <td>
                ${index + 1}
            </td>

            <td>
                <input
                    data-field="title"
                    data-index="${index}"
                    value="${escapeHtml(el.title)}"
                >
            </td>

            <td>
                <input
                    type="number"
                    min="0"
                    data-field="points"
                    data-index="${index}"
                    value="${el.points}"
                >
            </td>

            <td>
                <select
                    data-field="winner"
                    data-index="${index}"
                >
                    ${winners.map(w=>`
                        <option
                            value="${w}"
                            ${w===el.winner ? "selected" : ""}
                        >
                            ${w}
                        </option>
                    `).join("")}
                </select>
            </td>

            <td>
                <div class="move-buttons">

                    <button
                        class="btn-secondary"
                        onclick="moveRow(${index},-1)"
                        ${index===0 ? "disabled" : ""}
                    >
                        ↑
                    </button>

                    <button
                        class="btn-secondary"
                        onclick="moveRow(${index},1)"
                        ${index===elements.length-1 ? "disabled" : ""}
                    >
                        ↓
                    </button>

                </div>
            </td>

            <td>
                <button
                    class="btn-danger"
                    onclick="removeRow(${index})"
                >
                    Esborrar
                </button>
            </td>
        `;

        tbody.appendChild(tr);

    });

}

function renderMobile(){

    mobileList.innerHTML = "";

    elements.forEach((el,index)=>{

        const card = document.createElement("div");

        card.className = "mobile-card";

        card.innerHTML = `

            <div class="card-top">

                <strong>
                    #${index + 1}
                </strong>

                <div class="mobile-actions">

                    <button
                        class="btn-secondary"
                        onclick="moveRow(${index},-1)"
                        ${index===0 ? "disabled" : ""}
                    >
                        ↑
                    </button>

                    <button
                        class="btn-secondary"
                        onclick="moveRow(${index},1)"
                        ${index===elements.length-1 ? "disabled" : ""}
                    >
                        ↓
                    </button>

                    <button
                        class="btn-danger"
                        onclick="removeRow(${index})"
                    >
                        Eliminar
                    </button>

                </div>

            </div>

            <div class="mobile-grid">

                <div class="field">

                    <label>Títol</label>

                    <input
                        data-field="title"
                        data-index="${index}"
                        value="${escapeHtml(el.title)}"
                    >

                </div>

                <div class="field">

                    <label>Punts</label>

                    <input
                        type="number"
                        min="0"
                        data-field="points"
                        data-index="${index}"
                        value="${el.points}"
                    >

                </div>

                <div class="field">

                    <label>Guanyador</label>

                    <select
                        data-field="winner"
                        data-index="${index}"
                    >

                        ${winners.map(w=>`
                            <option
                                value="${w}"
                                ${w===el.winner ? "selected" : ""}
                            >
                                ${w}
                            </option>
                        `).join("")}

                    </select>

                </div>

            </div>
        `;

        mobileList.appendChild(card);

    });

}

function addRow(){

    elements.push({
        title:"",
        points:0,
        winner:"Per disputar"
    });

    render();

    setDirty(true);

}

function removeRow(index){

    elements.splice(index,1);

    render();

    setDirty(true);

}

function moveRow(index,direction){

    const newIndex = index + direction;

    if(
        newIndex < 0 ||
        newIndex >= elements.length
    ){
        return;
    }

    [
        elements[index],
        elements[newIndex]
    ] = [
        elements[newIndex],
        elements[index]
    ];

    render();

    setDirty(true);

}

function resetStatus(){

    const ok = confirm(
        "Reset all winners to 'Per disputar'?"
    );

    if(!ok) return;

    elements = elements.map(el=>({
        ...el,
        winner:"Per disputar"
    }));

    render();

    setDirty(true);

}

function escapeHtml(str){

    return String(str)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;");

}

document.addEventListener("input",(e)=>{

    const field = e.target.dataset.field;
    const index = e.target.dataset.index;

    if(field === undefined) return;

    if(field === "points"){

        elements[index][field] =
            parseInt(e.target.value) || 0;

    }else{

        elements[index][field] =
            e.target.value;

    }

    setDirty(true);

});

document.addEventListener("change",(e)=>{

    const field = e.target.dataset.field;
    const index = e.target.dataset.index;

    if(field === undefined) return;

    elements[index][field] = e.target.value;

    setDirty(true);

});

async function saveJSON(){

    try{

        updateStatus("Guardant...");

        const body = {

            message:"Update data.json",

            content:encodeBase64UTF8(
                JSON.stringify(
                    {elements},
                    null,
                    2
                )
            ),

            sha,
            branch

        };

        const res = await fetch(
            `https://api.github.com/repos/${repo}/contents/${path}`,
            {
                method:"PUT",

                headers:{
                    Authorization:`token ${token}`,
                    "Content-Type":"application/json"
                },

                body:JSON.stringify(body)
            }
        );

        const result = await res.json();

        if(result.content){

            sha = result.content.sha;

            setDirty(false);

            updateStatus("Guardat correctament");

        }else{

            console.error(result);

            alert(
                result.message || "Error guardant"
            );

            updateStatus("Error guardant");

        }

    }catch(err){

        console.error(err);

        updateStatus("Error guardant");

        alert(err.message);

    }

}

document.querySelector("#loadBtn")
    .addEventListener("click",fetchJSON);

document.querySelector("#addBtn")
    .addEventListener("click",addRow);

document.querySelector("#resetBtn")
    .addEventListener("click",resetStatus);

document.querySelector("#saveBtn")
    .addEventListener("click",saveJSON);

window.addEventListener("beforeunload",(e)=>{

    if(!dirty) return;

    e.preventDefault();
    e.returnValue = "";

});

</script>

</body>
</html>
