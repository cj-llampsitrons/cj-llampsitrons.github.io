ve/DEU-TRO-2xl.png 1600w"></figure></td><td style="width: 49.9288%;"><figure class="post__image post__image--center"><img loading="lazy" src="https://lacreualtallampsitrons.cat/media/posts/13/DEU-LLAMP.png" alt="" width="220" height="157" sizes="(max-width: 48em) 100vw, 768px" srcset="https://lacreualtallampsitrons.cat/media/posts/13/responsive/DEU-LLAMP-xs.png 300w, https://lacreualtallampsitrons.cat/media/posts/13/responsive/DEU-LLAMP-sm.png 480w, https://lacreualtallampsitrons.cat/media/posts/13/responsive/DEU-LLAMP-md.png 768w, https://lacreualtallampsitrons.cat/media/posts/13/responsive/DEU-LLAMP-lg.png 1024w, https://lacreualtallampsitrons.cat/media/posts/13/responsive/DEU-LLAMP-xl.png 1360w, https://lacreualtallampsitrons.cat/media/posts/13/responsive/DEU-LLAMP-2xl.png 1600w"></figure></td></tr><tr><td class="align-center" style="width: 49.9288%;"><strong><span id="counter-tro">0</span></strong></td><td class="align-center" style="width: 49.9288%;"><strong><span id="counter-llamp">0</span></strong></td></tr></tbody></table><hr></div><table><thead><tr><th class="align-left" style="font-weight: bold;">Prova</th><th class="align-left" style="font-weight: bold;">Punts</th><th class="align-left" style="font-weight: bold;">Guanyador</th></tr></thead><tbody id="table-body"></tbody></table><p><script>async function loadData() {

    try {

        // Evita caché
        const url =
            `https://lacreualtallampsitrons.cat/comptador/data.json?timestamp=${new Date().getTime()}`;

        // Carrega JSON
        const response = await fetch(url);
        const data = await response.json();

        // Comptadors
        let troPoints = 0;
        let llampPoints = 0;

        const tableBody =
            document.getElementById('table-body');

        tableBody.innerHTML = '';

        // Recorre elements
        data.elements.forEach(element => {

            // IMPORTANT:
            // Ara mostrem EXACTAMENT
            // el valor del JSON
            const winner = element.winner;

            // Crear fila
            const row = document.createElement('tr');

            // Títol
            const titleCell = document.createElement('td');
            titleCell.textContent = element.title;
            row.appendChild(titleCell);

            // Punts
            const pointsCell = document.createElement('td');
            pointsCell.textContent = element.points;
            row.appendChild(pointsCell);

            // Guanyador
            const winnerCell = document.createElement('td');
            winnerCell.textContent = winner;
            row.appendChild(winnerCell);

            // Afegir fila
            tableBody.appendChild(row);

            // Comptadors
            if (winner === 'Trons') {

                troPoints += element.points;

            } else if (winner === 'Llamps') {

                llampPoints += element.points;

            }

        });

        // Actualitzar comptadors
        document.getElementById('counter-tro')
            .textContent = `${troPoints}`;

        document.getElementById('counter-llamp')
            .textContent = `${llampPoints}`;

    } catch (error) {

        console.error(
            'Error loading JSON file:',
            error
        );

    }

}

// Carrega inicial
loadData();

// Recarrega cada 20 segons
setInterval(loadData, 20000);</script></p><p class="align-center"><span style="color: #34495e;"><em>El marcador s'actualitza sol cada 20 segons</em></span></p></div></article></main><footer id="copyright"><ul><li>Coordinadora Jove de la Creu Alta "Llamps i Trons"</li></ul><p class="align-center" style="padding-top: 30px;"><a href="https://instagram.com/llampsitrons" target="_blank" rel="noopener"><svg class="fi fi-instagram" width="24px" height="24px" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><use href="https://lacreualtallampsitrons.cat/media/plugins/featherIcons/feather-sprite.svg#instagram"/></svg></a>          <a href="https://twitter.com/llampsitrons" target="_blank" rel="noopener"><svg class="fi fi-twitter" width="24px" height="24px" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><use href="https://lacreualtallampsitrons.cat/media/plugins/featherIcons/feather-sprite.svg#twitter"/></svg></a>         <a href="https://www.google.com/maps?ll=41.555944,2.102388&amp;z=16&amp;t=m&amp;hl=ca&amp;gl=ES&amp;mapclient=embed&amp;cid=5111388773219777051" target="_blank" rel="noopener"><svg class="fi fi-map-pin" width="24px" height="24px" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><use href="https://lacreualtallampsitrons.cat/media/plugins/featherIcons/feather-sprite.svg#map-pin"/></svg></a></p></footer></div><script src="https://lacreualtallampsitrons.cat/assets/js/jquery.min.js?v=c9771cc3e90e18f5336eedbd0fffb2cf"></script><script src="https://lacreualtallampsitrons.cat/assets/js/jquery.scrollex.min.js?v=f89065e3d988006af9791b44561d7c90"></script><script src="https://lacreualtallampsitrons.cat/assets/js/jquery.scrolly.min.js?v=1ed5a78bde1476875a40f6b9ff44fc14"></script><script src="https://lacreualtallampsitrons.cat/assets/js/browser.min.js?v=c07298dd19048a8a69ad97e754dfe8d0"></script><script src="https://lacreualtallampsitrons.cat/assets/js/breakpoints.min.js?v=81a479eb099e3b187613943b085923b8
